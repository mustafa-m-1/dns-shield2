<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DNS Shield</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        p {
            font-size: 20px;
            color: #555;
        }

        .box {
            background: white;
            padding: 30px;
            margin-top: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h2>DNS Shield</h2>
</header>

<main>

    <h1>حماية الإنترنت تبدأ من DNS</h1>

    <p>
        احجب الإعلانات والمواقع الضارة والدومينات التي لا تريد الوصول إليها.
    </p>

    <div class="box">

        <h2>DNS Filtering</h2>

        <p>
            خدمة DNS ذكية للتحكم في الإنترنت من خلال الراوتر.
        </p>

        <button>
            ابدأ الآن
        </button>

    </div>

</main>

</body>
</html>
