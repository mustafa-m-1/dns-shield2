<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - DNS Shield</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 17px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            line-height: 1.7;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>إنشاء حساب</h1>

        <p class="subtitle">
            أنشئ حسابك في DNS Shield
        </p>

        <form id="signupForm">

            <label for="name">الاسم</label>
            <input
                type="text"
                id="name"
                placeholder="اكتب اسمك"
                required
            >

            <label for="email">البريد الإلكتروني</label>
            <input
                type="email"
                id="email"
                placeholder="example@email.com"
                required
            >

            <label for="password">كلمة المرور</label>
            <input
                type="password"
                id="password"
                placeholder="6 أحرف على الأقل"
                minlength="6"
                required
            >

            <label for="confirmPassword">تأكيد كلمة المرور</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="أعد كتابة كلمة المرور"
                minlength="6"
                required
            >

            <button type="submit" id="signupButton">
                إنشاء الحساب
            </button>

        </form>

        <div id="message"></div>

        <a class="back" href="index.html">
            العودة إلى الصفحة الرئيسية
        </a>

    </div>

</div>


<!-- مكتبة Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    // ==========================================
    // بيانات مشروع Supabase
    // ==========================================

    const SUPABASE_URL = "https://lrqoxcawphwfuprnrhgv.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_aqDNj0IN8UpTLSKMLS8qZQ_qTuBqPMV";


    // إنشاء اتصال Supabase
    const { createClient } = supabase;

    const db = createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


    // ==========================================
    // نموذج التسجيل
    // ==========================================

    const form = document.getElementById("signupForm");

    const message = document.getElementById("message");

    const button = document.getElementById("signupButton");


    form.addEventListener("submit", async function(event) {

        event.preventDefault();


        const name =
            document.getElementById("name").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;


        // التأكد من تطابق كلمتي المرور

        if (password !== confirmPassword) {

            message.className = "error";

            message.textContent =
                "كلمتا المرور غير متطابقتين.";

            return;
        }


        // منع الضغط المتكرر

        button.disabled = true;

        button.textContent = "جاري إنشاء الحساب...";

        message.textContent = "";


        try {

            const { data, error } = await db.auth.signUp({
    email,
    password,
    options: {
        data: {
            full_name: name
        }
    }
});

if (error) {
    throw error;
}


            message.className = "success";

            message.textContent =
                "تم إنشاء الحساب بنجاح. تحقق من بريدك الإلكتروني لتأكيد الحساب.";




        } catch (error) {

            message.className = "error";

message.textContent =
    "حدث خطأ: " + error.message;

        }


        button.disabled = false;

        button.textContent = "إنشاء الحساب";

    });

</script>

</body>
</html>
