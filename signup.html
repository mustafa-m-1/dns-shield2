<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>إنشاء حساب - DNS Shield</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        .container {
            width: 90%;
            max-width: 450px;
            margin: 70px auto;
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .box {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        .login a {
            color: #2563eb;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="logo">
        DNS Shield
    </div>

    <div class="box">

        <h1>
            إنشاء حساب
        </h1>

        <form>

            <label>
                الاسم
            </label>

            <input
                type="text"
                placeholder="اكتب اسمك"
            >

            <label>
                البريد الإلكتروني
            </label>

            <input
                type="email"
                placeholder="example@email.com"
            >

            <label>
                كلمة المرور
            </label>

            <input
                type="password"
                placeholder="كلمة المرور"
            >

            <label>
                تأكيد كلمة المرور
            </label>

            <input
                type="password"
                placeholder="أعد كتابة كلمة المرور"
            >

            <button type="submit">
                إنشاء الحساب
            </button>

        </form>

        <div class="login">

            لديك حساب بالفعل؟

            <a href="#">
                تسجيل الدخول
            </a>

        </div>

    </div>

</div>

</body>

</html>
